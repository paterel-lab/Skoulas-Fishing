name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Εγκατάσταση πακέτων
        run: npm install
      - name: Δημιουργία Android project
        run: npx cap add android
      - name: Δικαιώματα GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' "$M"
          grep -c ACCESS_FINE_LOCATION "$M"
      - name: Σταθερό κλειδί υπογραφής
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Συγχρονισμός αρχείων εφαρμογής
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Skoulas-Fishing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
